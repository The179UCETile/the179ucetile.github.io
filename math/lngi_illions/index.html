<!DOCTYPE html>
<html>
	<head>
    <meta charset="UTF-8">
		<link rel="stylesheet" href="../../styles.css">
		<link rel="stylesheet" href="styles.css">
		<title>Illions LNGI</title>
		<link rel="icon" type="image/x-icon" href="https://the179ucetile.github.io/images/favicons/placeholder.png">
	</head>
	<body>
		<p id="factor">Speed: x1</p>
		<button onclick="pause()" id="pause">Pause</button>
		<button onclick="resetSpeed()">Reset speed</button>
		<button onclick="speedUp()">x2 speed</button>
		<button onclick="slowDown()">/2 speed</button>
		<button onclick="reverse()">Reverse</button>
		<button onclick="t += 16000">Next tier</button>
		<button onclick="t = Math.max(0, t - 16000)">Previous tier</button>
		<br>
		<label for="font">Font:</label>
		<input type="text" id="fontinput" value="'monospace textwall'">
		<label for="fontbold">Bold:</label>
		<input type="checkbox" id="fontbold">
		<label for="altnum">Use alternate formatting:</label>
		<input type="checkbox" id="altnum">
		<label for="reducedfps">Reduce FPS:</label>
		<input type="checkbox" id="reducedfps">
    <p id="num"></p>
    <p id="num_alt"></p>
    <p id="num_illion"></p>
    <script src="../../game_scripts/break_eternity.min.js"></script>
    <script src="../../game_scripts/eternal_notations.min.js"></script>
    <script src="lngi.js"></script>
	</body>
</html>
